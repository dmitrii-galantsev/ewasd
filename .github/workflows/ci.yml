name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The monorepo tests are filesystem- and git-sensitive; cover macOS
          # too, where /tmp is a symlink and paths resolve differently.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,color]"

      - name: Show git version
        run: git --version

      - name: Run tests
        run: python -m pytest -v

  lint:
    name: pre-commit (ruff, formatting, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  types:
    # Advisory: the package currently has pre-existing mypy findings, so this
    # reports without gating. Flip continue-on-error off once they are cleared.
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,color]"
      - name: Type check
        run: python -m mypy ewasd

  version-sync:
    # The version is declared in both pyproject.toml and flake.nix; a mismatch
    # ships a Nix package whose reported version is wrong.
    name: version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pyproject.toml and flake.nix versions
        run: |
          py_version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          nix_version=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' flake.nix | head -1)
          echo "pyproject.toml: ${py_version:-<none>}"
          echo "flake.nix:      ${nix_version:-<none>}"
          if [ -z "$py_version" ] || [ -z "$nix_version" ]; then
            echo "::error::could not parse a version from pyproject.toml or flake.nix"
            exit 1
          fi
          if [ "$py_version" != "$nix_version" ]; then
            echo "::error::version mismatch - bump both files"
            exit 1
          fi

  nix:
    # ewasd is distributed as a Nix flake, and the build runs pytest inside the
    # sandbox, so this validates packaging and the test suite together.
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Build package (runs the test suite in the sandbox)
        run: nix build .#ewasd -L
      - name: Smoke test the built binary
        run: ./result/bin/ewasd --version
